name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feat/**', 'test/**', 'chore/**']

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, public/UI audit, and production build
        run: npm run check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke — desktop, iPhone WebKit, Android
        run: npm run test:e2e
