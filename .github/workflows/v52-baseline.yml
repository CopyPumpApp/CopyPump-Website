name: V52 baseline
on:
  push:
    branches: [feat/v52-publication-ready]
    paths: [.github/workflows/v52-baseline.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --audit=false
      - name: Package allowlisted public website files
        run: |
          mkdir -p /tmp/v52
          tar -czf /tmp/v52/baseline.tar.gz src public scripts tests docs node_modules index.html package.json package-lock.json tsconfig.json vite.config.ts playwright.config.ts README.md .github/workflows/ci.yml
          git ls-tree -r --name-only HEAD > /tmp/v52/files.txt
      - uses: actions/upload-artifact@v7
        with:
          name: v52-baseline
          path: /tmp/v52
          retention-days: 2
