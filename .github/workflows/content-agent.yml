name: Website Content Agent

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/content-agent-trigger']
  schedule:
    # Four evenly spaced Radar/update windows per UTC day.
    - cron: '37 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: website-content-agent
  cancel-in-progress: false

jobs:
  sync-public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fetch verified public milestone feed
        env:
          PROJECT_TOKEN: ${{ secrets.COPY_PUMP_PROJECT_TOKEN }}
        shell: bash
        run: |
          set -u
          mkdir -p .content-agent
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE="Garbuz7/CopyPump-Eternal/docs/PUBLIC_MILESTONES.json"
          if [ -z "${PROJECT_TOKEN:-}" ]; then
            printf '{"state":"unavailable","checkedAt":"%s","source":"%s","detail":"COPY_PUMP_PROJECT_TOKEN missing"}\n' "$NOW" "$SOURCE" > .content-agent/project-status.json
            echo "::warning::Project status source unavailable: token missing."
          else
            HTTP_CODE="$(curl --silent --show-error --write-out '%{http_code}' --output .content-agent/source.json               -H "Authorization: Bearer $PROJECT_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/Garbuz7/CopyPump-Eternal/contents/docs/PUBLIC_MILESTONES.json?ref=main" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              if node scripts/sync-public-project-status.mjs .content-agent/source.json; then
                printf '{"state":"ok","checkedAt":"%s","source":"%s"}\n' "$NOW" "$SOURCE" > .content-agent/project-status.json
              else
                printf '{"state":"attention","checkedAt":"%s","source":"%s","detail":"source validation failed"}\n' "$NOW" "$SOURCE" > .content-agent/project-status.json
                echo "::warning::Milestone feed failed validation; existing public content was preserved."
              fi
            else
              rm -f .content-agent/source.json
              printf '{"state":"unavailable","checkedAt":"%s","source":"%s","detail":"GitHub HTTP %s"}\n' "$NOW" "$SOURCE" "$HTTP_CODE" > .content-agent/project-status.json
              echo "::warning::Project source unavailable: GitHub HTTP $HTTP_CODE. Existing public content was preserved."
            fi
          fi

      - name: Recheck published Radar evidence
        run: node scripts/refresh-radar.mjs

      - name: Discover one fresh verified Radar story
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: kimi-k2.6
          KIMI_MAX_ATTEMPTS: '2'
          KIMI_REQUEST_TIMEOUT_MS: '45000'
        run: node scripts/discover-web-radar.mjs

      - name: Write public agent heartbeat
        run: node scripts/write-agent-status.mjs

      - name: Data-only diff guards
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_FILES="$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.content-agent/' | sort -u )" node scripts/content-only-guard.mjs
          node scripts/radar-data-guard.mjs

      - name: Verify autonomous diff is exactly allowlisted
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.content-agent/' | sort -u )"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/content/project-status\.generated\.ts|public/public-status\.json|public/agent-status\.json|public/radar/index\.json|public/radar/observations/[a-z0-9-]+\.json|public/radar/evidence/auto-transaction-[a-z0-9-]+\.json)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected autonomous website diff:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --audit=false

      - name: Full website verification
        run: npm run check

      - name: Commit verified data only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.content-agent/' | sort -u )"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public-safe data update."
            exit 0
          fi
          git config user.name "CopyPump Content Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/project-status.generated.ts public/public-status.json public/agent-status.json public/radar/index.json public/radar/observations
          git add public/radar/evidence/auto-transaction-*.json 2>/dev/null || true
          git commit -m "content: autonomous project and Radar data refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Require Cloudflare credentials for data-only deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Deploy verified data-only update
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify public data-agent endpoint
        if: steps.commit.outputs.changed == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 https://copypump-website.copypumphq.workers.dev/agent-status.json >/dev/null; then
              echo "DATA_AGENT_PRODUCTION_OK"
              exit 0
            fi
            sleep 5
          done
          echo "Data-agent production endpoint did not pass post-deploy verification."
          exit 1
