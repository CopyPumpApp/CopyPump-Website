name: Website Content Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '37 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: website-content-agent
  cancel-in-progress: false

jobs:
  sync-public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fetch verified public milestone feed
        env:
          PROJECT_TOKEN: ${{ secrets.COPY_PUMP_PROJECT_TOKEN }}
        run: |
          mkdir -p .content-agent
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "No COPY_PUMP_PROJECT_TOKEN in website repo; fail closed without changing content."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $PROJECT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Garbuz7/CopyPump-Eternal/contents/docs/PUBLIC_MILESTONES.json?ref=main" \
            > .content-agent/source.json
          node scripts/sync-public-project-status.mjs .content-agent/source.json

      - name: Content-only diff guard
        run: |
          CHANGED_FILES="$(git diff --name-only)" node scripts/content-only-guard.mjs

      - name: Verify autonomous diff is exactly allowlisted
        run: |
          git diff --exit-code -- \
            src/premium/premium.css \
            src/premium/header-canopy.css \
            src/premium/Site.tsx \
            src/premium/SceneBackdrop.tsx \
            src/premium/ChapterArtwork.tsx \
            src/premium/HeaderSceneCanopy.tsx \
            src/premium/useAnimatedMenu.ts \
            src/premium/usePageEntrance.ts \
            src/premium/useArtworkSwipe.ts \
            src/styles/index.css
          UNEXPECTED="$(git diff --name-only | grep -Ev '^(src/content/project-status\.generated\.ts|public/public-status\.json)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected autonomous website diff:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --audit=false

      - name: Full website verification
        run: npm run check

      - name: Commit verified content only
        run: |
          if git diff --quiet; then
            echo "No public-safe content update."
            exit 0
          fi
          git config user.name "CopyPump Content Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/project-status.generated.ts public/public-status.json
          git commit -m "content: sync verified public project status"
          git push
