name: Remove stale background reference
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-stale-background-reference
      - name: Replace removed PNG reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/app.css')
          s=p.read_text()
          old='/backgrounds/copypump-global-market-background.png'
          new='/backgrounds/copypump-cinematic-environment-v46.webp'
          assert old in s, 'stale PNG reference not found'
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          ! grep -R "copypump-global-market-background.png" src public
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/app.css
          git commit -m "fix: remove stale background asset reference"
          git push origin HEAD:fix/remove-stale-background-reference
