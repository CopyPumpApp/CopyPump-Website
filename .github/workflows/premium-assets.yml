name: Prepare same-art premium assets
on:
  push:
    branches: [feat/premium-v48]
    paths: [.github/workflows/premium-assets.yml, scripts/prepare-premium-assets.py]
permissions:
  contents: write
jobs:
  assets:
    if: github.ref == 'refs/heads/feat/premium-v48'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/premium-v48
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare-premium-assets.py
      - uses: actions/upload-artifact@v7
        with:
          name: premium-same-art-assets
          path: public/media/v48
          retention-days: 2
      - name: Commit only generated artwork to the design branch
        run: |
          git config user.name 'CopyPump website build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/v48
          git diff --cached --quiet && exit 0
          git commit -m 'perf: derive responsive variants from approved original artwork'
          git push origin HEAD:feat/premium-v48
