name: Recovery Remove CopyCube
on:
  push:
    branches: [recovery/premium-restoration]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/premium-restoration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove CopyCube from public dictionaries
        run: |
          node <<'NODE'
          const fs=require('fs');
          for (const file of ['src/i18n/en.json','src/i18n/ru.json']) {
            const d=JSON.parse(fs.readFileSync(file,'utf8'));
            const journal=d?.studio?.journal;
            if (journal) for (const key of ['updateLabel','updateTitle','updateText']) delete journal[key];
            const faq=d?.studio?.faq;
            if (faq?.items) faq.items=faq.items.filter(x=>!JSON.stringify(x).toLowerCase().includes('copycube'));
            fs.writeFileSync(file,JSON.stringify(d,null,2)+'\n');
          }
          NODE
          if grep -Rni --exclude='recovery-remove-copycube.yml' 'copycube' src public; then
            echo 'CopyCube remains in public source' >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/i18n/en.json src/i18n/ru.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove CopyCube from public website content'
          git push origin HEAD:recovery/premium-restoration
