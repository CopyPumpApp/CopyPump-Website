name: Integrate verified v51 scene update
on:
  push:
    branches: [feat/premium-v51-motion]
    paths: [.github/workflows/v51-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/premium-v51-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/premium-v51-motion
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply exact locally checked UTF-8 edits
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          for manifest in sorted(Path('.ops').glob('v51-*.json')):
              for change in json.loads(manifest.read_text()):
                  path=Path(change['path'])
                  assert path.parts[0] in ['src','public','scripts','tests'] and '..' not in path.parts
                  old=path.read_text(); assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)+' base mismatch'
                  new=old
                  for start,end,text in reversed(change['edits']):
                      if isinstance(text,dict):
                          extra=Path(text['file']); assert extra.parent==Path('.ops') and extra.name=='v51-style-tail.css'
                          text=extra.read_text()
                      new=new[:start]+text+new[end:]
                  assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)+' result mismatch'
                  path.write_text(new)
                  print('Verified:',path)
          PY
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare-v51-scenes.py
      - run: npm ci --audit=false && npm run check
      - name: Commit validated preview only
        run: |
          git config user.name 'CopyPump v51 integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .ops/v51-small.json .ops/v51-motion.json .ops/v51-site.json .ops/v51-style.json .ops/v51-style-tail.css .github/workflows/v51-integrate.yml .github/workflows/v51-baseline.yml
          git add src public scripts tests docs
          git commit -m 'feat: integrate v51 cinematic motion and seven native-resolution scenes'
          git push origin HEAD:feat/premium-v51-motion
