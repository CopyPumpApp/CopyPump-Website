name: Isolated v51 header rendering
on:
  push:
    branches: [ops/v51-canopy-render]
    paths: [.github/workflows/canopy-render.yml]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --audit=false && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare real pixels; do not modify any application files
        run: |
          node --input-type=module <<'JS'
          import {chromium,webkit,devices} from 'playwright';
          import {spawn} from 'node:child_process';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const out='canopy-render';mkdirSync(out,{recursive:true});
          const server=spawn('npm',['run','preview','--','--host','127.0.0.1','--port','4173'],{stdio:'ignore'});
          const variants={
            baseline:'/* unchanged */',
            noMask:'.site-header::before{-webkit-mask-image:none;mask-image:none}',
            noOpacityTransition:'.site-header,.site-frame,#root{transition:none;will-change:auto}',
            ownFilter:'.site-header[data-scrolled=true]{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.site-header::before{-webkit-backdrop-filter:none;backdrop-filter:none}',
            fixedSibling:'.site-header::before{display:none}.diag-canopy{position:fixed;top:0;left:0;right:0;height:calc(var(--diag-height) + 32px);z-index:50;pointer-events:none;background:linear-gradient(180deg,rgba(3,8,18,.55),rgba(3,8,18,.38) 70%,rgba(3,8,18,.16));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}',
            noRootIsolation:'#root{isolation:auto}.site-frame{z-index:auto}',
            noMasksAnywhere:'.site-header::before{-webkit-mask-image:none;mask-image:none}.site-header,.site-frame,#root{opacity:1;transition:none;will-change:auto;isolation:auto}'
          };
          const report=[];
          try{
            let ready=false;
            for(let i=0;i<60;i++){try{const r=await fetch('http://127.0.0.1:4173');if(r.ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,300))}
            if(!ready)throw new Error('Preview server unavailable');
            for(const [label,engine,device] of [['desktop',chromium,{viewport:{width:1440,height:1000}}],['iphone',webkit,devices['iPhone 14']]]){
              const browser=await engine.launch();
              try{
                const context=await browser.newContext({...device});const page=await context.newPage();
                for(const [name,css] of Object.entries(variants)){
                  await page.goto('http://127.0.0.1:4173/ru');await page.waitForTimeout(1800);
                  await page.locator('.hero-bottom p').evaluate(n=>scrollTo({top:n.getBoundingClientRect().top+scrollY-28,behavior:'auto'}));
                  await page.waitForTimeout(650);await page.addStyleTag({content:css});
                  if(name==='fixedSibling')await page.evaluate(()=>{const n=document.createElement('div');n.className='diag-canopy';n.style.setProperty('--diag-height',document.querySelector('.site-header').getBoundingClientRect().height+'px');document.querySelector('.site-frame').prepend(n)});
                  await page.waitForTimeout(450);await page.screenshot({path:`${out}/${label}-${name}.png`});
                  const data=await page.locator('.site-header').evaluate(n=>{
                    const s=getComputedStyle(n,'::before'),ancestors=[];
                    for(let p=n;p;p=p.parentElement){const t=getComputedStyle(p);ancestors.push({tag:p.tagName,class:p.className,opacity:t.opacity,filter:t.filter,backdrop:t.backdropFilter,mask:t.maskImage,isolation:t.isolation,willChange:t.willChange,transform:t.transform})}
                    return{pseudo:{opacity:s.opacity,blur:s.backdropFilter||s.getPropertyValue('-webkit-backdrop-filter'),zIndex:s.zIndex,mask:s.maskImage||s.getPropertyValue('-webkit-mask-image')},ancestors}
                  });
                  report.push({label,name,...data});
                }
              }finally{await browser.close()}
            }
            writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));
          }finally{server.kill('SIGTERM')}
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v51-canopy-render-comparison
          path: canopy-render
          retention-days: 2
