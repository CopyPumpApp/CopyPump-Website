name: One-shot stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-superseded-branches:
    if: github.repository == 'CopyPumpApp/CopyPump-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main with authenticated remote
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Delete the reviewed stale branch set
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/ci-dependency-cleanup"
            "chore/p0-legacy-dialog-cleanup"
            "chore/release-seo-cleanup"
            "chore/remove-dialog-legacy"
            "chore/repository-cleanup"
            "chore/repository-metadata-polish"
            "chore/stabilization-p2-cleanup"
            "feat/desktop-premium-density"
            "feat/desktop-project-premium-v2"
            "feat/premium-stabilization-v48"
            "feat/premium-v48"
            "feat/premium-v49"
            "feat/premium-v50-radar"
            "feat/premium-v51-1-polish"
            "feat/premium-v51-motion"
            "feat/product-story-motion-polish"
            "feat/readable-project-details"
            "feat/v52-publication-content"
            "feat/v52-publication-ready"
            "fix/clean-ui-no-instructions"
            "fix/demo-container-spacing"
            "fix/demo-layout-safe-area"
            "fix/home-mobile-motion-overlay"
            "fix/ios-mobile-nav-overlay"
            "fix/mobile-header-safe-area"
            "fix/mobile-nav-layout-v2"
            "fix/mobile-nav-viewport-and-bg-reference"
            "fix/mobile-nav-visibility"
            "fix/motion-and-menu-state"
            "fix/move-project-info-off-home"
            "fix/p0-mobile-overlay-cleanup"
            "fix/p1-project-disclosures"
            "fix/premium-scroll-and-product-scenes"
            "fix/project-background-scale-v2"
            "fix/project-desktop-composition"
            "fix/project-scale-background"
            "fix/public-site-product-clarity"
            "fix/remove-all-ui-arrows-and-help"
            "fix/remove-stale-background-reference"
            "fix/reveal-lifecycle"
            "ops/v51-canopy-render"
            "ops/v52-final-review"
            "ops/verify-v49-publication"
            "ops/verify-v52-render"
            "ops/verify-v511-publication"
            "perf/workflow-assets"
            "reconstruction/final-v4"
            "recovery/premium-restoration"
            "test/playwright-smoke"
            "chore/delete-stale-branches"
          )
          failures=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "Refusing to delete main"
              failures=$((failures + 1))
              continue
            fi
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              if ! git push origin --delete "$branch"; then
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done
          if (( failures > 0 )); then
            echo "$failures branch deletion(s) failed"
            exit 1
          fi
          echo "Reviewed stale branch set removed."
