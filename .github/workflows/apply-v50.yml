name: Apply locally validated v50 integration
on:
  push:
    branches: [feat/premium-v50-radar]
    paths: [.github/workflows/apply-v50.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/premium-v50-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/premium-v50-radar
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed edits, verifying both sides
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          changes=json.loads(Path('.ops/v50-modifications.json').read_text())
          for change in changes:
              path=Path(change['path']);assert path.parts[0] in ['src','public','scripts','tests'];assert '..' not in path.parts
              old=path.read_text();assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)+' base mismatch'
              new=old
              for start,end,text in reversed(change['edits']):new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)+' result mismatch'
              path.write_text(new)
          PY
      - run: python scripts/prepare-radar-edition01.py
      - run: npm ci --audit=false && npm run check
      - name: Commit validated source only to the preview branch
        run: |
          git config user.name 'CopyPump v50 integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .ops/v50-modifications.json .github/workflows/apply-v50.yml .github/workflows/v50-baseline.yml .github/workflows/v50-evidence.yml
          git add src public scripts tests docs
          git commit -m 'feat: integrate verified Radar edition and v50 cinematic refinements'
          git push origin HEAD:feat/premium-v50-radar
